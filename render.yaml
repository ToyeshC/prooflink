services:
  - name: prooflink
    type: web
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/ToyeshC/prooflink
    branch: main
    buildCommand: npm install --include=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INFERENCE_MODEL
        sync: false
